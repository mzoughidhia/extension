name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Aucun secret n'est nécessaire : le développement et les tests reposent
# intégralement sur un projet Firebase `demo-` émulé (cf. ADR-007).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # Le runner fournit Chrome ; le launcher ChromeHeadlessCI ajoute
        # --no-sandbox, requis en conteneur.
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:ci

      - name: Build
        run: npm run build
